spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: ai-health-helper
  datasource:
    url: jdbc:mysql://localhost:3306/ai-helper?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    # 数据库用户名
    username: ${MYSQL_USERNAME}
    # 数据库密码
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  #sql:
    #init:
      #mode: always
server:
  # 服务器端口
  port: 8080
