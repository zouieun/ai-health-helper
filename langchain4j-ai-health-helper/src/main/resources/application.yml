  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        # API Key 1
        api-key: ${DASHSCOPE_API_KEY}
      streaming-chat-model:
        model-name: qwen-max
        # API Key 1
        api-key: ${DASHSCOPE_API_KEY}
      embedding-model:
        model-name: text-embedding-v4
        # API Key 1
        api-key: ${DASHSCOPE_API_KEY}
bigmodel: # 通过mcp通信协议传递格式化调用接口和参数
  # API Key 2
  api-key: ${BIGMODEL_API_KEY}
research:
  report:
    max-tool-calls: 2
    step-timeout-seconds: 20
    generation-timeout-seconds: 40
#mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.example.aicodehelper.mapper: debug
ai:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    secret-key: ${JWT_SECRET}
    # 设置jwt过期时间
    ttl: 7200000
    # 设置前端传递过来的令牌名称
    token-name: token
